name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quorum
          POSTGRES_PASSWORD: quorum
          POSTGRES_DB: quorum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://quorum:quorum@localhost:5432/quorum
      APP_URL: http://localhost:3000
      K_ID: cXVvcnVtLWNpLWstaWQtMzItYnl0ZXMta2V5LTAwMDAwMQ==
      K_EMARG: cXVvcnVtLWNpLWstZW1hcmctMzItYnl0ZXMta2V5LTAwMg==
      K_SIG: cXVvcnVtLWNpLWstc2lnLTMyLWJ5dGVzLWtleS0wMDAwMw==
      K_OTP: cXVvcnVtLWNpLWstb3RwLTMyLWJ5dGVzLWtleS0wMDAwNA==
      MASTER_KEY: cXVvcnVtLWNpLW1hc3Rlci0zMi1ieXRlcy1rZXktMDAwNQ==
      ALLOWED_EMAIL_DOMAIN: etu.u-bordeaux.fr
      ADMIN_EMAILS: test.admin@etu.u-bordeaux.fr
      ELECTORATE_SIZE: "56000"
      PETITION_THRESHOLD: "300"
      PETITION_COLLECT_DAYS: "7"
      MAIL_DRIVER: console
      MAIL_FROM: Quorum <code@exemple.fr>
      CRON_SECRET: quorum-ci-cron-secret-minimum-32-characters-0001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations PostgreSQL
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Vérification TypeScript
        run: pnpm typecheck

      - name: Tests unitaires et invariants
        run: pnpm test

      - name: Build Next.js
        run: pnpm build

      - name: Installer Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests E2E Playwright
        run: pnpm test:e2e
